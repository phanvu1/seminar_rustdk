# ============================================================
# Hướng dẫn:
#   1. Chạy: docker compose up -d
#   2. Kiểm tra: docker compose ps
#   3. Xem log: docker compose logs -f hbbs
#   4. Dừng: docker compose down
# ============================================================

services:
  # ----------------------------------------------------------
  # hbbs - RustDesk ID/Rendezvous Server
  # Vai trò: Đăng ký thiết bị, xác thực, thiết lập kết nối
  # Cổng: Cô lập trên giao diện VPN WireGuard 10.13.13.1
  # ----------------------------------------------------------
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r 10.13.13.1:21117
    ports:
      # CÔ LẬP CỔNG: Chỉ cho phép lưu lượng đi qua mạng WireGuard VPN 10.13.13.1 (Khóa mạng LAN vật lý)
      - "10.13.13.1:21115:21115"       # NAT type test (chỉ qua VPN)
      - "10.13.13.1:21116:21116"       # ID registration TCP (chỉ qua VPN)
      - "10.13.13.1:21116:21116/udp"   # ID registration UDP (chỉ qua VPN)
      - "10.13.13.1:21118:21118"       # WebSocket (chỉ qua VPN)
    volumes:
      - ./data:/root        # Lưu key, database
    restart: unless-stopped
    depends_on:
      - hbbr
    networks:
      - rustdesk-net

  # ----------------------------------------------------------
  # hbbr - RustDesk Relay Server
  # Vai trò: Chuyển tiếp lưu lượng khi không kết nối P2P được
  # Cổng: Cô lập trên giao diện VPN WireGuard 10.13.13.1
  # ----------------------------------------------------------
  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    ports:
      # CÔ LẬP CỔNG: Chỉ cho phép relay qua mạng WireGuard VPN 10.13.13.1
      - "10.13.13.1:21117:21117"       # Relay (chỉ qua VPN)
      - "10.13.13.1:21119:21119"       # WebSocket relay (chỉ qua VPN)
    volumes:
      - ./data:/root
    restart: unless-stopped
    networks:
      - rustdesk-net


 # --- WIREGUARD VPN CHO 20 NHÂN SỰ TẠI 3 TRỤ SỞ ---
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - SERVERURL=192.168.106.1 # Endpoint IP Public / LAN Host
      - SERVERPORT=51820
      - PEERS=20                # SINH ĐỦ 20 CẤU HÌNH & 20 PRIVATE KEYS (peer1 -> peer20, 10.13.13.2 -> 10.13.13.21)
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0/24
    volumes:
      - ./wireguard-config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - rustdesk-net
      
# ----------------------------------------------------------
# Network - Mạng riêng cho 2 container
# ----------------------------------------------------------
networks:
  rustdesk-net:
    driver: bridge